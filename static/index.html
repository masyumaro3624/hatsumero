<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>発車メロディー観測</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>🎵 発車メロディー観測</h1>
      <p class="lead">完全HTML版 | 番線ごとの鳴動確率を観測・集計</p>
    </header>

    <main class="main-grid">
      <section class="card">
        <h2 style="margin-top:0">投稿フォーム</h2>
        
        <label style="font-weight:600;margin:0 0 8px">駅を選択 *</label>
        <input type="text" id="stationSearch" placeholder="駅名を検索..." 
          style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);font-size:14px;margin-bottom:8px" />
        <div class="station-selector" id="stationList"></div>

        <form id="obsForm" class="form" style="margin-top:16px">
          <label>番線 *
            <input id="platform" type="number" min="1" step="1" required />
          </label>

          <label>コーラス数 *
            <input id="choruses" type="number" step="0.1" min="0" value="0" required />
            <small class="hint">例: 1, 1.1, 2.5 (1.0以上で成功)</small>
          </label>

          <label>時刻
            <input id="reported_at" type="datetime-local" />
          </label>

          <label>行き先
            <input id="destination" placeholder="例: 高崎" />
          </label>

          <label>メモ
            <input id="note" placeholder="例: 普通電車" />
          </label>

          <div class="form-actions">
            <button type="submit">投稿</button>
          </div>
        </form>
      </section>

      <section>
        <div id="stationStats">
          <div class="card" style="text-align:center;padding:40px">
            <p style="color:var(--muted)">駅を選んで投稿してください</p>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <small>発車メロディー観測 HTML版</small>
    </footer>
  </div>

  <div id="detailsModal" class="modal">
    <div class="modal-content">
      <span class="modal-close" onclick="closeModal()">&times;</span>
      <h3 id="modalTitle">直近の観測</h3>
      <div id="modalBody"></div>
    </div>
  </div>

  <div id="fileInputModal" class="modal">
    <div class="modal-content">
      <span class="modal-close" onclick="closeFileModal()">&times;</span>
      <h3>stops.txt をアップロード</h3>
      <p style="color:var(--muted);font-size:14px">GTFS形式のstops.txtファイルをアップロードして駅情報を読み込みます</p>
      <input type="file" id="stopsFileInput" accept=".txt" style="width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;margin:16px 0" />
      <div style="display:flex;gap:10px">
        <button onclick="uploadStopsFile()" style="flex:1">アップロード</button>
        <button type="button" onclick="closeFileModal()" style="flex:1">キャンセル</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
